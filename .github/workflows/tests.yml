name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      # Qt draws off screen, so the interface tests need no display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyflakes

      - name: Check for mistakes such as unused or missing imports
        run: pyflakes calculator tests main.py packaging/make_icns.py packaging/make_dmg_background.py

      - name: Run the tests
        run: python -m pytest -v
